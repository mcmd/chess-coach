[project]
name = "chess-coach"
version = "1.0.0"
description = "An engine-grounded, Elo-aware AI chess coach (Gemini + Stockfish + Maia-3)"
requires-python = ">=3.10"
dependencies = [
    "chess>=1.10",
    "rich>=13",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "prompt_toolkit>=3.0",
    "requests>=2.31",
    # maia3 (AGPL-3.0): in-process human-move model. Pinned to a commit for reproducibility;
    # pulls huggingface-hub/hf-xet/typer transitively.
    "maia3 @ git+https://github.com/CSSLab/maia3.git@1e13597c42d4858b7cfd7cfdae01e297263364b2",
    # model / runtime deps (explicit pins for some platforms):
    "einops==0.8.0",
    "pyzstd>=0.19.1",
    "tqdm>=4.65.0",
    "numpy>=2.1.0",
    "torch>=2.6.0",
    "PyYAML",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "autopep8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
